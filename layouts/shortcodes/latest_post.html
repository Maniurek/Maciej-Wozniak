{{ $latest := index (where .Site.RegularPages "Section" "posts") 0 }}

<!-- The master link card container capturing your hover interactions -->
<a href="{{ $latest.Permalink }}" class="project-card-link" style="display: block; color: inherit; text-decoration: none;">
  <div class="list-post" style="margin-bottom: 4rem; text-align: left;">
    
    <!-- 1. Clean Date (No grey opacity, matches title style) -->
    <span class="list-post-date" style="display: block; font-size: 0.8rem; margin-bottom: 1px;">
      {{ $latest.Date.Format "January 2, 2006" }}
    </span>

    <!-- 2. Clean Title -->
    <h3 class="list-post-title" style="margin: 0 0 16px 0; font-size: 1.5rem; font-weight: normal; display: block;">
      {{ $latest.Title }}
    </h3>

    <!-- 3. The Visual Thumbnail Container -->
    <div class="list-post-summary" style="display: block; width: 100%;">
      <div class="portfolio-thumb">
        {{ $latest.Summary }}
      </div>
    </div>

  </div>
</a>
